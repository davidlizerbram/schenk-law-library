<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Schenk Law Library</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Vignette */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* Header */
    .header {
      padding: 56px 64px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .teal-rule-top {
      width: 100px;
      border: none;
      height: 1px;
      background-color: #427284;
    }

    .header img {
      width: 84px;
      height: auto;
    }

    .header h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 100;
      font-size: 2rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffffff;
    }

    /* Main content */
    .content {
      flex: 1;
      padding: 48px 64px 64px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      max-width: 880px;
      margin: 0 auto;
      width: 100%;
    }

    /* Entrance animation */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .topic-card {
      display: block;
      text-align: center;
      background-color: #131313;
      border: 1.5px solid #427284;
      border-radius: 3px;
      padding: 50px 40px;
      text-decoration: none;
      color: #f0f0f0;
      transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .topic-card:nth-child(1) { animation-delay: 0.1s; }
    .topic-card:nth-child(2) { animation-delay: 0.25s; }
    .topic-card:nth-child(3) { animation-delay: 0.4s; }

    .topic-card:hover {
      background-color: #1a1a1a;
      transform: translateY(-3px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 12px rgba(66, 114, 132, 0.08);
    }

    .topic-card span.label {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: 1.3rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    /* Footer */
    .footer-rule {
      max-width: 880px;
      margin: 0 auto;
      width: calc(100% - 128px);
      border: none;
      height: 1px;
      background-color: #427284;
    }

    .footer {
      max-width: 880px;
      margin: 0 auto;
      width: calc(100% - 128px);
      padding: 28px 0 56px;
      font-family: Calibri, Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
      color: #F8F7F5;
      line-height: 2;
      text-align: center;
    }

    .footer a {
      color: #427284;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: #5a9ab5;
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body::before {
        background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.4) 100%);
      }

      .header {
        padding: 40px 20px 28px;
        gap: 12px;
      }

      .header img {
        width: 64px;
      }

      .header h1 {
        font-size: 1.25rem;
        letter-spacing: 0.1em;
      }

      .content {
        padding: 32px 16px 48px;
        gap: 22px;
      }

      .topic-card {
        padding: 40px 20px;
      }

      .topic-card span.label {
        font-size: 1.05rem;
        letter-spacing: 0.18em;
      }

      .footer-rule {
        width: calc(100% - 32px);
      }

      .footer {
        width: calc(100% - 32px);
        padding: 24px 0 40px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <img src="logo-wht.png" alt="The Schenk Law Firm monogram">
    <hr class="teal-rule-top">
    <h1>The Schenk Law Library</h1>
  </header>

  <main class="content">
    <a href="https://drive.google.com/drive/u/1/folders/1V06Q3nxErcx8oEXhlC5063sHMG0OaBAR" target="_blank" class="topic-card">
      <span class="label">AI Psychosis</span>
    </a>

    <a href="https://drive.google.com/drive/u/1/folders/1R8OXRfFXjU51R2GRegazUC-0wCrhWX5g" target="_blank" class="topic-card">
      <span class="label">Underage Gambling</span>
    </a>

    <a href="https://drive.google.com/drive/u/1/folders/18yUd7cOgi4bLN-R7flbN1b-CrYHkT35g" target="_blank" class="topic-card">
      <span class="label">Asbestos Mesothelioma</span>
    </a>
  </main>

  <hr class="footer-rule">

  <footer class="footer">
    Created and maintained by The Schenk Law Firm, LLP. <a href="https://schenklawfirm.com" target="_blank">schenklawfirm.com</a><br>
    Please contact <a href="mailto:david@schenklawfirm.com">david@schenklawfirm.com</a> with any questions.
  </footer>

</body>
</html>
